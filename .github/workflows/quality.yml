name: Validar sitio
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm audit
      - name: Verificar que el sitio funciona sin WhatsApp configurado
        env:
          BLANDSKRON_WHATSAPP: "off"
        run: |
          npm run build
          npm test -- --grep "Configuración de WhatsApp"
